name: Manual Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit ID to release (e.g., a1b2c3d)'
        required: true
      tag_name:
        description: 'Tag name for the release (e.g., v1.5.3)'
        required: true
      release_name:
        description: 'Name of the release (leave empty to use commit title)'
        required: false
      target_browser:
        description: 'Target browser build to release'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'chrome only'
          - 'firefox only'
      prerelease:
        description: 'Publish as Pre-release'
        required: false
        default: false
        type: boolean
      sign_firefox:
        description: 'Firefox XPI signing'
        required: true
        default: 'sign with AMO'
        type: choice
        options:
          - 'sign with AMO'
          - 'do not sign'
      recompress_only:
        description: 'Recompress only: download an existing release, recompress its XPIs/source zips, and re-upload (skip build and sign)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        if: ${{ !inputs.recompress_only }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get Commit Details
        id: commit_info
        run: |
          SHA="${{ github.event.inputs.commit_sha }}"
          TITLE=$(git log -1 --pretty=%s "$SHA")
          BODY=$(git log -1 --pretty=%b "$SHA")
          
          CUSTOM_NAME="${{ github.event.inputs.release_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            FINAL_NAME="$CUSTOM_NAME"
          else
            FINAL_NAME="$TITLE"
          fi
          
          echo "release_name=$FINAL_NAME" >> $GITHUB_OUTPUT
          
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          SIGN_CHOICE="${{ github.event.inputs.sign_firefox }}"
          TARGET_BROWSER="${{ github.event.inputs.target_browser }}"
          
          if [ "$SIGN_CHOICE" = "sign with AMO" ] && [ "$TARGET_BROWSER" != "chrome only" ]; then
            if [[ "$INPUT_TAG" != *-signed ]]; then
              RELEASE_TAG="${INPUT_TAG}-signed"
            else
              RELEASE_TAG="$INPUT_TAG"
            fi
          else
            RELEASE_TAG="$INPUT_TAG"
          fi
          
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          
          if [ -z "$BODY" ]; then
            echo "body=$TITLE" >> $GITHUB_OUTPUT
          else
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Run Build Script
        if: ${{ !inputs.recompress_only }}
        run: |
          if [ "${{ github.event.inputs.target_browser }}" = "both" ]; then
            node src/build.js all
          elif [ "${{ github.event.inputs.target_browser }}" = "chrome only" ]; then
            node src/build.js chrome
            node src/build.js chrome-yt
            node src/build.js chrome-light
            node src/build.js chrome-yt-light
            node src/build.js chrome-debug
            node src/build.js chrome-yt-debug
            node src/build.js chrome-light-debug
            node src/build.js chrome-yt-light-debug
          elif [ "${{ github.event.inputs.target_browser }}" = "firefox only" ]; then
            node src/build.js firefox
            node src/build.js firefox-amo
            node src/build.js firefox-light
            node src/build.js firefox-light-amo
            node src/build.js firefox-debug
            node src/build.js firefox-light-debug
          fi

      - name: Minify Builds
        if: ${{ !inputs.recompress_only }}
        run: |
          npm install terser html-minifier-terser clean-css
          node src/minify.js

      - name: Create Release Archives
        if: ${{ !inputs.recompress_only }}
        run: |
          if [ "${{ github.event.inputs.target_browser }}" = "both" ] || [ "${{ github.event.inputs.target_browser }}" = "chrome only" ]; then
            cd build/chrome
            zip -9 -r ../../website-media-downloader-chrome-${{ github.event.inputs.tag_name }}.zip ./*
            cd ../..

            cd build/chrome-yt
            zip -9 -r ../../website-media-downloader-chrome-yt-${{ github.event.inputs.tag_name }}.zip ./*
            cd ../..

            cd build/chrome-light
            zip -9 -r ../../website-media-downloader-chrome-light-${{ github.event.inputs.tag_name }}.zip ./*
            cd ../..

            cd build/chrome-yt-light
            zip -9 -r ../../website-media-downloader-chrome-yt-light-${{ github.event.inputs.tag_name }}.zip ./*
            cd ../..

            cd build/chrome-debug
            zip -9 -r ../../website-media-downloader-chrome-debug-${{ github.event.inputs.tag_name }}.zip ./*
            cd ../..

            cd build/chrome-yt-debug
            zip -9 -r ../../website-media-downloader-chrome-yt-debug-${{ github.event.inputs.tag_name }}.zip ./*
            cd ../..

            cd build/chrome-light-debug
            zip -9 -r ../../website-media-downloader-chrome-light-debug-${{ github.event.inputs.tag_name }}.zip ./*
            cd ../..

            cd build/chrome-yt-light-debug
            zip -9 -r ../../website-media-downloader-chrome-yt-light-debug-${{ github.event.inputs.tag_name }}.zip ./*
            cd ../..

            mkdir -p chrome-source-temp/src
            cp -r build/chrome/* chrome-source-temp/src/
            cp LICENSE.md CONTRIBUTING.md chrome-source-temp/
            if [ -f build/chrome/README.md ]; then
              cp build/chrome/README.md chrome-source-temp/README.md
            else
              cp README.md chrome-source-temp/README.md
            fi
            cp -r licenses chrome-source-temp/
            cd chrome-source-temp
            zip -9 -r ../website-media-downloader-chrome-source-${{ github.event.inputs.tag_name }}.zip ./*
            cd ..
            rm -rf chrome-source-temp

            mkdir -p chrome-yt-source-temp/src
            cp -r build/chrome-yt/* chrome-yt-source-temp/src/
            cp LICENSE.md CONTRIBUTING.md chrome-yt-source-temp/
            if [ -f build/chrome-yt/README.md ]; then
              cp build/chrome-yt/README.md chrome-yt-source-temp/README.md
            else
              cp README.md chrome-yt-source-temp/README.md
            fi
            cp -r licenses chrome-yt-source-temp/
            cd chrome-yt-source-temp
            zip -9 -r ../website-media-downloader-chrome-yt-source-${{ github.event.inputs.tag_name }}.zip ./*
            cd ..
            rm -rf chrome-yt-source-temp

            mkdir -p chrome-light-source-temp/src
            cp -r build/chrome-light/* chrome-light-source-temp/src/
            cp LICENSE.md CONTRIBUTING.md chrome-light-source-temp/
            if [ -f build/chrome-light/README.md ]; then
              cp build/chrome-light/README.md chrome-light-source-temp/README.md
            else
              cp README.md chrome-light-source-temp/README.md
            fi
            cp -r licenses chrome-light-source-temp/
            cd chrome-light-source-temp
            zip -9 -r ../website-media-downloader-chrome-light-source-${{ github.event.inputs.tag_name }}.zip ./*
            cd ..
            rm -rf chrome-light-source-temp

            mkdir -p chrome-yt-light-source-temp/src
            cp -r build/chrome-yt-light/* chrome-yt-light-source-temp/src/
            cp LICENSE.md CONTRIBUTING.md chrome-yt-light-source-temp/
            if [ -f build/chrome-yt-light/README.md ]; then
              cp build/chrome-yt-light/README.md chrome-yt-light-source-temp/README.md
            else
              cp README.md chrome-yt-light-source-temp/README.md
            fi
            cp -r licenses chrome-yt-light-source-temp/
            cd chrome-yt-light-source-temp
            zip -9 -r ../website-media-downloader-chrome-yt-light-source-${{ github.event.inputs.tag_name }}.zip ./*
            cd ..
            rm -rf chrome-yt-light-source-temp
          fi
          
          if [ "${{ github.event.inputs.target_browser }}" = "both" ] || [ "${{ github.event.inputs.target_browser }}" = "firefox only" ]; then
            cd build/firefox
            zip -9 -r ../../website-media-downloader-firefox-${{ github.event.inputs.tag_name }}.xpi ./*
            cd ../..

            cd build/firefox-light
            zip -9 -r ../../website-media-downloader-firefox-light-${{ github.event.inputs.tag_name }}.xpi ./*
            cd ../..

            cd build/firefox-debug
            zip -9 -r ../../website-media-downloader-firefox-debug-${{ github.event.inputs.tag_name }}.xpi ./*
            cd ../..

            cd build/firefox-light-debug
            zip -9 -r ../../website-media-downloader-firefox-light-debug-${{ github.event.inputs.tag_name }}.xpi ./*
            cd ../..

            mkdir -p firefox-source-temp/src
            cp -r build/firefox/* firefox-source-temp/src/
            cp README.md LICENSE.md CONTRIBUTING.md firefox-source-temp/
            cp -r licenses firefox-source-temp/
            cd firefox-source-temp
            zip -9 -r ../website-media-downloader-firefox-source-${{ github.event.inputs.tag_name }}.zip ./*
            cd ..
            rm -rf firefox-source-temp

            mkdir -p firefox-light-source-temp/src
            cp -r build/firefox-light/* firefox-light-source-temp/src/
            cp README.md LICENSE.md CONTRIBUTING.md firefox-light-source-temp/
            cp -r licenses firefox-light-source-temp/
            cd firefox-light-source-temp
            zip -9 -r ../website-media-downloader-firefox-light-source-${{ github.event.inputs.tag_name }}.zip ./*
            cd ..
            rm -rf firefox-light-source-temp

            mkdir -p firefox-amo-source-temp/src
            cp -r src/* firefox-amo-source-temp/src/
            cp README.md LICENSE.md CONTRIBUTING.md firefox-amo-source-temp/
            cp -r licenses firefox-amo-source-temp/
            cd firefox-amo-source-temp
            zip -9 -r ../website-media-downloader-firefox-amo-source-${{ github.event.inputs.tag_name }}.zip ./*
            cd ..
            rm -rf firefox-amo-source-temp

            mkdir -p firefox-light-amo-source-temp/src
            cp -r src/* firefox-light-amo-source-temp/src/
            cp README.md LICENSE.md CONTRIBUTING.md firefox-light-amo-source-temp/
            cp -r licenses firefox-light-amo-source-temp/
            cd firefox-light-amo-source-temp
            zip -9 -r ../website-media-downloader-firefox-light-amo-source-${{ github.event.inputs.tag_name }}.zip ./*
            cd ..
            rm -rf firefox-light-amo-source-temp
          fi

      - name: Sign Firefox Extension with AMO
        if: ${{ !inputs.recompress_only && inputs.sign_firefox == 'sign with AMO' && (github.event.inputs.target_browser == 'both' || github.event.inputs.target_browser == 'firefox only') }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets are required."
            exit 1
          fi

          sign_firefox_build() {
            SOURCE_DIR="$1"
            ARTIFACT_DIR="$2"
            OUTPUT_FILE="$3"
            SOURCE_ZIP="$4"

            mkdir -p "$ARTIFACT_DIR"
            UPLOAD_SOURCE_FLAG=""
            if [ -n "$SOURCE_ZIP" ] && [ -f "$SOURCE_ZIP" ]; then
              UPLOAD_SOURCE_FLAG="--upload-source-code $SOURCE_ZIP"
            fi
            LOG_FILE="/tmp/sign-$(basename "$SOURCE_DIR").log"
            set +e
            npx --yes web-ext sign \
              --source-dir "$SOURCE_DIR" \
              --artifacts-dir "$ARTIFACT_DIR" \
              --channel unlisted \
              --api-key "$WEB_EXT_API_KEY" \
              --api-secret "$WEB_EXT_API_SECRET" \
              $UPLOAD_SOURCE_FLAG 2>&1 | tee "$LOG_FILE"
            SIGN_RC=${PIPESTATUS[0]}
            set -e
            sleep 60
            if [ "$SIGN_RC" -eq 0 ]; then
              SIGNED_XPI=$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.xpi' -print -quit)
              if [ -z "$SIGNED_XPI" ]; then
                echo "WARNING: AMO did not return a signed XPI for $SOURCE_DIR, continuing with the next build."
                rm -f "$OUTPUT_FILE"
                return 0
              fi
              cp "$SIGNED_XPI" "$OUTPUT_FILE"
              return 0
            fi
            if grep -qiE "already exist|already been submitted|duplicate version" "$LOG_FILE"; then
              echo "Version for $SOURCE_DIR was already submitted, skipping re-sign."
              if gh release download "$RELEASE_TAG" --pattern "$(basename "$OUTPUT_FILE")" --dir . --clobber 2>/dev/null; then
                echo "Restored previously signed $OUTPUT_FILE from the GitHub release."
              else
                echo "WARNING: could not restore $OUTPUT_FILE from the GitHub release; removing unsigned file so Verify treats it as missing."
                rm -f "$OUTPUT_FILE"
              fi
              return 0
            fi
            echo "WARNING: signing $SOURCE_DIR failed (exit $SIGN_RC), continuing with the next build."
            rm -f "$OUTPUT_FILE"
            return 0
          }

          TAG="${{ github.event.inputs.tag_name }}"
          RELEASE_TAG="${{ steps.commit_info.outputs.release_tag }}"
          sign_firefox_build build/firefox signed-artifacts/firefox "website-media-downloader-firefox-$TAG.xpi" "website-media-downloader-firefox-source-$TAG.zip"
          sign_firefox_build build/firefox-light signed-artifacts/firefox-light "website-media-downloader-firefox-light-$TAG.xpi" "website-media-downloader-firefox-light-source-$TAG.zip"
          sign_firefox_build build/firefox-debug signed-artifacts/firefox-debug "website-media-downloader-firefox-debug-$TAG.xpi"
          sign_firefox_build build/firefox-light-debug signed-artifacts/firefox-light-debug "website-media-downloader-firefox-light-debug-$TAG.xpi"

          submit_listed_build() {
            SOURCE_DIR="$1"
            SOURCE_ZIP="$2"

            mkdir -p "listed-artifacts/$(basename "$SOURCE_DIR")"
            UPLOAD_SOURCE_FLAG=""
            if [ -n "$SOURCE_ZIP" ] && [ -f "$SOURCE_ZIP" ]; then
              UPLOAD_SOURCE_FLAG="--upload-source-code $SOURCE_ZIP"
            fi
            LOG_FILE="/tmp/submit-$(basename "$SOURCE_DIR").log"
            set +e
            npx --yes web-ext sign \
              --source-dir "$SOURCE_DIR" \
              --artifacts-dir "listed-artifacts/$(basename "$SOURCE_DIR")" \
              --channel listed \
              --approval-timeout 0 \
              --api-key "$WEB_EXT_API_KEY" \
              --api-secret "$WEB_EXT_API_SECRET" \
              $UPLOAD_SOURCE_FLAG 2>&1 | tee "$LOG_FILE"
            SIGN_RC=${PIPESTATUS[0]}
            set -e
            sleep 60
            if [ "$SIGN_RC" -eq 0 ]; then
              echo "Submitted $SOURCE_DIR to AMO listed channel (review pending)."
              return 0
            fi
            if grep -qiE "already exist|already been submitted|duplicate version" "$LOG_FILE"; then
              echo "Version for $SOURCE_DIR was already submitted to AMO listed channel, skipping."
              return 0
            fi
            echo "WARNING: listed submission for $SOURCE_DIR failed (exit $SIGN_RC), continuing (listed is optional)."
            return 0
          }

          submit_listed_build build/firefox-amo "website-media-downloader-firefox-amo-source-$TAG.zip"
          submit_listed_build build/firefox-light-amo "website-media-downloader-firefox-light-amo-source-$TAG.zip"

      - name: Download Existing Release Assets
        if: ${{ inputs.recompress_only && (github.event.inputs.target_browser == 'both' || github.event.inputs.target_browser == 'firefox only') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.commit_info.outputs.release_tag }}"
          gh release download "$TAG" --pattern 'website-media-downloader-firefox-*.xpi' --pattern 'website-media-downloader-*-source-*.zip' --dir . --clobber
          ls -la website-media-downloader-firefox-*.xpi website-media-downloader-*-source-*.zip

      - name: Recompress Signed XPIs and Source Archives
        if: ${{ github.event.inputs.target_browser == 'both' || github.event.inputs.target_browser == 'firefox only' }}
        run: |
          python3 - <<'PYEOF'
          import zipfile, hashlib, base64, re, os, glob

          def recompress(path):
              zin = zipfile.ZipFile(path, 'r')
              tmp = path + '.repacked'
              zout = zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED, compresslevel=9)
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  zi = zipfile.ZipInfo(item.filename, date_time=item.date_time)
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zi.external_attr = item.external_attr
                  zi.create_system = item.create_system
                  zout.writestr(zi, data)
              zout.close()
              zin.close()
              os.replace(tmp, path)

          def verify_signed(path):
              z = zipfile.ZipFile(path, 'r')
              names = z.namelist()
              if 'META-INF/manifest.mf' not in names:
                  z.close()
                  return None
              mf = z.read('META-INF/manifest.mf').decode('utf-8')
              entries = re.findall(r'Name: (.+)\nDigest-Algorithms: [^\n]+\nSHA1-Digest: [^\n]+\nSHA256-Digest: (\S+)', mf)
              checked = 0
              for name, b64 in entries:
                  if name not in names:
                      raise SystemExit(f'{path}: file in manifest missing from archive: {name}')
                  h = base64.b64encode(hashlib.sha256(z.read(name)).digest()).decode()
                  if h != b64:
                      raise SystemExit(f'{path}: hash mismatch for {name}, signature broken')
                  checked += 1
              z.close()
              return checked

          for pattern in ['website-media-downloader-firefox-*.xpi', 'website-media-downloader-*-source-*.zip']:
              for path in sorted(glob.glob(pattern)):
                  old = os.path.getsize(path)
                  recompress(path)
                  new = os.path.getsize(path)
                  checked = verify_signed(path)
                  status = f'signature OK ({checked} hashes)' if checked is not None else 'unsigned, no signature to check'
                  print(f'{path}: {old} -> {new} bytes ({status})')
          PYEOF

      - name: Verify Firefox Artifacts
        if: ${{ github.event.inputs.target_browser == 'both' || github.event.inputs.target_browser == 'firefox only' }}
        run: |
          FOUND=0
          for XPI in \
            "website-media-downloader-firefox-${{ github.event.inputs.tag_name }}.xpi" \
            "website-media-downloader-firefox-light-${{ github.event.inputs.tag_name }}.xpi" \
            "website-media-downloader-firefox-debug-${{ github.event.inputs.tag_name }}.xpi" \
            "website-media-downloader-firefox-light-debug-${{ github.event.inputs.tag_name }}.xpi"; do
            if [ ! -s "$XPI" ]; then
              echo "WARNING: $XPI missing, skipping (partial release)."
              continue
            fi
            unzip -t "$XPI"
            if [ "${{ inputs.sign_firefox }}" = "sign with AMO" ]; then
              unzip -Z1 "$XPI" | grep -Eq '^META-INF/(mozilla\.rsa|cose\.sig)$'
            fi
            FOUND=$((FOUND + 1))
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No signed Firefox XPI found, nothing to release."
            exit 1
          fi
          echo "Verified $FOUND of 4 Firefox XPIs."

      - name: Upload Recompressed Assets to Release
        if: ${{ inputs.recompress_only && (github.event.inputs.target_browser == 'both' || github.event.inputs.target_browser == 'firefox only') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.commit_info.outputs.release_tag }}"
          gh release upload "$TAG" website-media-downloader-firefox-*.xpi website-media-downloader-*-source-*.zip --clobber

      - name: Create GitHub Release
        if: ${{ !inputs.recompress_only }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.commit_info.outputs.release_tag }}
          name: ${{ steps.commit_info.outputs.release_name }}
          body: ${{ steps.commit_info.outputs.body }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            website-media-downloader-chrome-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-yt-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-light-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-yt-light-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-firefox-*.xpi
            website-media-downloader-chrome-debug-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-yt-debug-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-light-debug-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-yt-light-debug-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-source-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-yt-source-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-light-source-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-yt-light-source-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-firefox-source-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-firefox-light-source-${{ github.event.inputs.tag_name }}.zip
          fail_on_unmatched_files: false
          target_commitish: ${{ github.event.inputs.commit_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
