name: Build Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get version from manifest
        id: get_version
        run: |
          VERSION=$(jq -r '.version' src/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Run Build Script
        run: |
          node src/build.js all

      - name: Minify Builds
        run: |
          npm install terser html-minifier-terser clean-css
          node src/minify.js

      - name: Create Extension Archives
        run: |
          cd build/chrome
          zip -9 -r ../../website-media-downloader-chrome-${{ steps.get_version.outputs.version }}.zip ./*
          cd ../..

          cd build/chrome-yt
          zip -9 -r ../../website-media-downloader-chrome-yt-${{ steps.get_version.outputs.version }}.zip ./*
          cd ../..

          cd build/chrome-light
          zip -9 -r ../../website-media-downloader-chrome-light-${{ steps.get_version.outputs.version }}.zip ./*
          cd ../..

          cd build/chrome-yt-light
          zip -9 -r ../../website-media-downloader-chrome-yt-light-${{ steps.get_version.outputs.version }}.zip ./*
          cd ../..

          cd build/firefox
          zip -9 -r ../../website-media-downloader-firefox-${{ steps.get_version.outputs.version }}.xpi ./*
          cd ../..

          cd build/firefox-light
          zip -9 -r ../../website-media-downloader-firefox-light-${{ steps.get_version.outputs.version }}.xpi ./*
          cd ../..

      - name: Create Source Code Archives
        run: |
          zip -9 -r website-media-downloader-firefox-source-${{ steps.get_version.outputs.version }}.zip src README.md LICENSE.md CONTRIBUTING.md licenses -x "src/overrides/*" "src/build.js" "src/minify.js" "src/chrome_audio_jobs.js" "src/offscreen.html" "src/offscreen.js"

          mkdir -p firefox-light-source-temp/src
          cp -r build/firefox-light/* firefox-light-source-temp/src/
          cp README.md LICENSE.md CONTRIBUTING.md firefox-light-source-temp/
          cp -r licenses firefox-light-source-temp/
          cd firefox-light-source-temp
          zip -9 -r ../website-media-downloader-firefox-light-source-${{ steps.get_version.outputs.version }}.zip ./*
          cd ..
          rm -rf firefox-light-source-temp

          mkdir -p chrome-source-temp/src
          cp -r build/chrome/* chrome-source-temp/src/
          cp README.md LICENSE.md CONTRIBUTING.md chrome-source-temp/
          cp -r licenses chrome-source-temp/
          cd chrome-source-temp
          zip -9 -r ../website-media-downloader-chrome-source-${{ steps.get_version.outputs.version }}.zip ./*
          cd ..
          rm -rf chrome-source-temp

          mkdir -p chrome-yt-source-temp/src
          cp -r build/chrome-yt/* chrome-yt-source-temp/src/
          cp README.md LICENSE.md CONTRIBUTING.md chrome-yt-source-temp/
          cp -r licenses chrome-yt-source-temp/
          cd chrome-yt-source-temp
          zip -9 -r ../website-media-downloader-chrome-yt-source-${{ steps.get_version.outputs.version }}.zip ./*
          cd ..
          rm -rf chrome-yt-source-temp

          mkdir -p chrome-light-source-temp/src
          cp -r build/chrome-light/* chrome-light-source-temp/src/
          cp README.md LICENSE.md CONTRIBUTING.md chrome-light-source-temp/
          cp -r licenses chrome-light-source-temp/
          cd chrome-light-source-temp
          zip -9 -r ../website-media-downloader-chrome-light-source-${{ steps.get_version.outputs.version }}.zip ./*
          cd ..
          rm -rf chrome-light-source-temp

          mkdir -p chrome-yt-light-source-temp/src
          cp -r build/chrome-yt-light/* chrome-yt-light-source-temp/src/
          cp README.md LICENSE.md CONTRIBUTING.md chrome-yt-light-source-temp/
          cp -r licenses chrome-yt-light-source-temp/
          cd chrome-yt-light-source-temp
          zip -9 -r ../website-media-downloader-chrome-yt-light-source-${{ steps.get_version.outputs.version }}.zip ./*
          cd ..
          rm -rf chrome-yt-light-source-temp

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: website-media-downloader-v${{ steps.get_version.outputs.version }}
          path: |
            website-media-downloader-chrome-${{ steps.get_version.outputs.version }}.zip
            website-media-downloader-chrome-yt-${{ steps.get_version.outputs.version }}.zip
            website-media-downloader-firefox-${{ steps.get_version.outputs.version }}.xpi
            website-media-downloader-chrome-light-${{ steps.get_version.outputs.version }}.zip
            website-media-downloader-chrome-yt-light-${{ steps.get_version.outputs.version }}.zip
            website-media-downloader-firefox-light-${{ steps.get_version.outputs.version }}.xpi
            website-media-downloader-chrome-source-${{ steps.get_version.outputs.version }}.zip
            website-media-downloader-chrome-yt-source-${{ steps.get_version.outputs.version }}.zip
            website-media-downloader-chrome-light-source-${{ steps.get_version.outputs.version }}.zip
            website-media-downloader-chrome-yt-light-source-${{ steps.get_version.outputs.version }}.zip
            website-media-downloader-firefox-source-${{ steps.get_version.outputs.version }}.zip
            website-media-downloader-firefox-light-source-${{ steps.get_version.outputs.version }}.zip
          if-no-files-found: error
