<html lang="en" class="mdui-theme-auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="downloadManagerTitle">Download Manager</title>
  <script src="debug_logger.js"></script>
  <link rel="stylesheet" href="styles/mdui.css">
  <script src="libraries/mdui.global.js"></script>
  <script src="translations.js"></script>
  <style>
    :root {
      --dm-max-width: 640px;
      --dm-radius: 16px;
      --dm-card-radius: 14px;
      --dm-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: rgb(var(--mdui-color-surface));
      color: rgb(var(--mdui-color-on-surface));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    .dm-header {
      background: rgb(var(--mdui-color-surface-container));
      border-bottom: 1px solid rgb(var(--mdui-color-outline-variant));
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .dm-header-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.02em;
    }



    .dm-badge {
      font-size: 0.7rem;
      font-weight: 700;
      background: rgb(var(--mdui-color-surface-container-highest));
      color: rgb(var(--mdui-color-primary));
      padding: 3px 10px;
      border-radius: 100px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .manager-layout {
      max-width: var(--dm-max-width);
      width: 92%;
      margin: 24px auto 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-grow: 1;
    }

    .downloads-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .download-card {
      background: rgb(var(--mdui-color-surface-container-low));
      border: 1px solid rgb(var(--mdui-color-outline-variant));
      border-radius: var(--dm-card-radius);
      overflow: hidden;
      transition: var(--dm-transition);
      animation: cardSlideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }



    @keyframes cardSlideIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-content {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .icon-wrapper {
      width: 42px;
      height: 42px;
      background: rgb(var(--mdui-color-primary-container));
      color: rgb(var(--mdui-color-on-primary-container));
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--dm-transition);
    }

    .icon-wrapper mdui-icon {
      font-size: 22px;
    }



    .info-wrapper {
      flex-grow: 1;
      min-width: 0;
    }

    .file-name {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
      word-break: break-all;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .status-text {
      margin: 3px 0 0 0;
      font-size: 0.78rem;
      color: rgb(var(--mdui-color-on-surface-variant));
      font-weight: 500;
      transition: color 0.2s;
    }

    .progress-bar-wrapper {
      padding: 0 2px;
    }

    .progress-bar-wrapper mdui-linear-progress {
      --mdui-shape-corner-extra-small: 4px;
      height: 5px;
    }

    .button-group {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
    }

    .button-group mdui-button {
      --mdui-shape-corner-extra-small: 20px;
      height: 34px;
      font-weight: 600;
      font-size: 0.82rem;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 24px;
      background: rgb(var(--mdui-color-surface-container-low));
      border: 2px dashed rgb(var(--mdui-color-outline-variant));
      border-radius: var(--dm-radius);
      text-align: center;
      animation: emptyFadeIn 0.6s ease both;
    }

    @keyframes emptyFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      background: rgb(var(--mdui-color-surface-container-highest));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .empty-icon svg {
      width: 28px;
      height: 28px;
      color: rgb(var(--mdui-color-on-surface-variant));
      opacity: 0.7;
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }

    .empty-desc {
      font-size: 0.82rem;
      color: rgb(var(--mdui-color-on-surface-variant));
      margin: 0;
      font-weight: 500;
      max-width: 280px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .dm-header {
        padding: 12px 16px;
      }

      .manager-layout {
        width: 95%;
        margin: 16px auto 32px;
      }

      .card-content {
        padding: 14px;
      }

      .empty-state {
        padding: 40px 16px;
      }
    }

    html.theme-pitch-black,
    html.theme-pitch-black body,
    html.theme-pitch-black .dm-header {
        background-color: #000000 !important;
        background: #000000 !important;
        --mdui-color-surface: 0, 0, 0 !important;
        --mdui-color-surface-dim: 0, 0, 0 !important;
        --mdui-color-surface-bright: 10, 10, 10 !important;
        --mdui-color-surface-container-lowest: 0, 0, 0 !important;
        --mdui-color-surface-container-low: 8, 8, 8 !important;
        --mdui-color-surface-container: 12, 12, 12 !important;
        --mdui-color-surface-container-high: 20, 20, 20 !important;
        --mdui-color-surface-container-highest: 28, 28, 28 !important;
        --mdui-color-background: 0, 0, 0 !important;
    }

    html.theme-pitch-black .download-card {
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        background-color: #0c0c0c !important;
    }
  </style>
</head>
<body>

  <header class="dm-header">
    <h1 class="dm-header-title">
      <span data-translate="downloadManagerTitle">Download Manager</span>
    </h1>
    <span class="dm-badge">WMD</span>
  </header>

  <div class="manager-layout">
    <div id="list-header" style="display: none; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <mdui-checkbox id="select-all-downloads"></mdui-checkbox>
        <span id="selected-downloads-count" style="font-size: 0.8rem; font-weight: 700; opacity: 0.8;">0 selected</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <mdui-button id="delete-selected-downloads" variant="tonal" style="display: none; color: rgb(var(--mdui-color-error)); --mdui-shape-corner-extra-small: 20px; height: 32px; font-size: 0.8rem; font-weight: 700;" data-translate="deleteSelected">
          Delete Selected
        </mdui-button>
        <mdui-button id="close-all-downloads" variant="text" style="color: rgb(var(--mdui-color-error)); --mdui-shape-corner-extra-small: 20px; height: 32px; font-size: 0.8rem; font-weight: 700;" data-translate="closeAll">
          Close All
        </mdui-button>
        <mdui-button id="save-all-zip" variant="tonal" style="--mdui-shape-corner-extra-small: 20px; height: 32px; font-size: 0.8rem; font-weight: 700;" data-translate="saveAllZip">
          Save All as ZIP
        </mdui-button>
      </div>
    </div>

    <div id="empty-state" class="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </div>
      <h3 class="empty-title" data-translate="allCaughtUp">All Caught Up!</h3>
      <p class="empty-desc" data-translate="noActiveDownloadsDesc">No active downloads or tasks at the moment. Start downloading media to see them here.</p>
    </div>

    <div id="downloads-list" class="downloads-list"></div>
  </div>

  <script src="media_compute_client.js"></script>
  <script src="download.js"></script>
</body>
</html>
